services:
  # Base transaccional (OLTP) — sección 5.3.
  # En AWS es la instancia RDS PostgreSQL de 5.7.
  oltp:
    image: postgres:16-alpine
    container_name: airline-oltp
    environment:
      POSTGRES_USER: airline
      POSTGRES_PASSWORD: airline
      POSTGRES_DB: airline
    ports:
      - "5433:5432"
    volumes:
      - ./sql/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./sql/02_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
      - oltp_data:/var/lib/postgresql/data
    # max_connections holgado: la prueba de concurrencia abre N conexiones
    # simultáneas y debe medir contención sobre la FILA, no sobre el pool.
    command: >
      postgres -c max_connections=200
               -c log_lock_waits=on
               -c deadlock_timeout=1s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airline -d airline"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Base analítica (OLAP) — sección 5.7.
  # Réplica local del segundo RDS PostgreSQL, destino del ETL.
  olap:
    image: postgres:16-alpine
    container_name: airline-olap
    environment:
      POSTGRES_USER: analytics
      POSTGRES_PASSWORD: analytics
      POSTGRES_DB: analytics
    ports:
      - "5434:5432"
    volumes:
      - ../etl/sql/olap_schema.sql:/docker-entrypoint-initdb.d/01_olap.sql:ro
      - olap_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analytics -d analytics"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    container_name: airline-api
    environment:
      DATABASE_URL: postgresql+psycopg://airline:airline@oltp:5432/airline
      HOLD_MINUTES: "20"
      LOCK_TIMEOUT_MS: "3000"
    ports:
      - "8010:8000"
    depends_on:
      oltp:
        condition: service_healthy
    # 4 workers: la prueba de concurrencia debe atravesar procesos distintos,
    # no solo hilos del mismo proceso. Si un único worker serializara las
    # solicitudes, la prueba no demostraría nada sobre el bloqueo en la base.
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4

volumes:
  oltp_data:
  olap_data:
